name: gorm-unloaded-infra

services:
  postgres:
    container_name: "gorm-unloaded-infra-postgres"
    image: bitnami/postgresql:latest
    environment:
      POSTGRESQL_USERNAME: postgres
      POSTGRESQL_PASSWORD: postgres
      POSTGRESQL_DATABASE: root
      POSTGRESQL_REPLICATION_MODE: master
      POSTGRESQL_REPLICATION_USER: repl_user
      POSTGRESQL_REPLICATION_PASSWORD: repl_password
    ports:
      - "15432:5432"
    volumes:
      - postgres-datavol:/bitnami/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-replica:
    container_name: "gorm-unloaded-infra-postgres-replica"
    image: bitnami/postgresql:latest
    environment:
      POSTGRESQL_USERNAME: postgres
      POSTGRESQL_PASSWORD: postgres
      POSTGRESQL_REPLICATION_MODE: slave
      POSTGRESQL_MASTER_HOST: postgres
      POSTGRESQL_MASTER_PORT_NUMBER: 5432
      POSTGRESQL_REPLICATION_USER: repl_user
      POSTGRESQL_REPLICATION_PASSWORD: repl_password
      POSTGRESQL_EXTRA_FLAGS: "-c recovery_min_apply_delay=3s"
    ports:
      - "15433:5432"
    volumes:
      - postgres-replica-datavol:/bitnami/postgresql
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-datavol:
    name: gorm-unloaded-infra-postgres-datavol
  postgres-replica-datavol:
    name: gorm-unloaded-infra-postgres-replica-datavol

networks:
  default:
    name: gorm-unloaded-infra-default
